<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre de repli minimal : les balises SEO réelles sont injectées par SEOHead (react-helmet-async). -->
    <title>GearHub</title>
    <meta name="author" content="GearHub" />

    <!-- Balises de repli pour les robots qui ne rendent pas le JavaScript (Slack, Discord, X, Facebook...). -->
    <!-- SEOHead les remplace dynamiquement dès que le JS s'exécute. -->
    <meta name="description" content="Tests indépendants et guides d'achat : claviers, souris, casques et moniteurs gaming, plus les accessoires qui complètent un setup PC en 2026." />
    <meta property="og:site_name" content="GearHub" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="GearHub — Périphériques gaming et setup PC testés" />
    <meta property="og:description" content="Tests indépendants et guides d'achat : claviers, souris, casques et moniteurs gaming, plus les accessoires qui complètent un setup PC en 2026." />
    <meta property="og:image" content="https://www.highends.store/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
